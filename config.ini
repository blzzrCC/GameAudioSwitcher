; 游戏音频自动切换 - 配置文件
; 修改后需重新启动程序生效（UTF-8 编码）

[devices]
; 游戏运行时切换到的设备名称（需与 Windows 声音设置中的名称完全一致）
headphone=耳机 (Realtek(R) Audio)
; 无游戏运行时使用的设备名称
speaker=扬声器 (Realtek(R) Audio)

[settings]
; 游戏进程检测间隔（毫秒，最小 500）
poll_interval_ms=2000
; 切换时是否显示托盘气泡通知（1=显示，0=关闭）
balloon=1

[games]
; 游戏本体进程名列表，多个用英文分号 ; 分隔，不含 .exe 亦可
; 任一进程存在即视为游戏运行中（只认本体，不含启动器/客户端）
processes=VALORANT-Win64-Shipping.exe;VALORANT.exe;ABInfinite-Win64-Shipping.exe;ABInfinite.exe
